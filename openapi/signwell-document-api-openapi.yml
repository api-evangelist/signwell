          type: array
          description: Exclude one or more template placeholders when creating a document from a template. Any excluded placeholders (and their associated recipients and fields) will not be included on the created document. Values must match placeholder names on the template. You can't exclude all placeholders (at least one recipient must remain).
          items:
            type: string
        draft:
          type: boolean
          default: false
          description: Whether the document can still be updated before sending a signature request. If set to `false` the document is sent for signing as part of this request. Defaults to `false`.
        with_signature_page:
          type: boolean
          default: false
          description: When set to `true` the document will have a signature page added to the end, and all signers will be required to add their signature on that page.
        expires_in:
          type: integer
          minimum: 1

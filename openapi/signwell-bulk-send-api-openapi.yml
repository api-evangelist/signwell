      - data
    Base64Flag:
      type: boolean
      description: When true, returns the CSV as a base64-encoded string in a JSON response instead of a binary file download.
    BulkSendResponse:
      type: object
      description: Bulk send details
      properties:
        id:
          type: string
          format: uuid
        name:

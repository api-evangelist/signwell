    document.
  label: LabelsResponse
  term: LabelsResponse
  type: schema
- description: Labels can be used to organize documents and templates in a way that
    can make it easy to find using the document search/template search in SignWell.
    Labels can be used to organize documents in a way that can make it easy to find
    using the document search in SignWell.
  label: LabelResponse
  term: LabelResponse
  type: schema
- description: Labels can be used to organize documents and templates in a way that
    can make it easy to find using the document search/template search in SignWell.
    Labels can be used to organize documents in a way that can make it easy to find
    using the document search in SignWell.
  label: LabelRequest
  term: LabelRequest

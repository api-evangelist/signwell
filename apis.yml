apis:
- aid: signwell:signwell-api
  name: SignWell API
  description: REST API for programmatically sending documents for electronic signature,
    creating and managing templates, tracking document status, managing signers, running
    bulk sends, and configuring webhooks. Supports embedded signing iframes, draft
    documents, conditional sending, and MX NOM-151 compliance certificates.

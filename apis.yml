aid: signwell
name: SignWell
description: E-signature platform with a REST API for sending documents for signature,
  creating templates, tracking document status, and managing signers programmatically.
  Supports embedded signing, bulk send, webhooks, and white-label customization with
  compliance for ESIGN, UETA, GDPR, and HIPAA.
type: Index
